# ============================================================================
# dsh-girl-live2d —— DSH bundle patch
# ============================================================================
# 插件挂载声明。DSH 启动时按 bundle 层栈叠加 patch，本文件把桌宠插件插入
# Web profile 的配置树。
#
# 安装（从 GitHub 仓库）：
#   dsh plugin --profile web add github:xuemingze/dsh-girl-live2d
# 安装（本地源码/下载使用，进入下载目录后使用相对路径）：
#   dsh plugin --profile web add "link:."
# 或在上一级目录使用相对路径：
#   dsh plugin --profile web add "link:./dsh-girl-live2d"
# 卸载：
#   dsh plugin --profile web remove dsh-girl-live2d
#
# ⚠️ 下面 insert 的 `name:` 必须与安装后的**包名**完全一致，否则 DSH 找不到模块，
#    表现为「装上了但桌宠不出现」。
# ============================================================================

- insert:
    - id: dsh-live2d-pet
      name: dsh-girl-live2d
